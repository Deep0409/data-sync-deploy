# How External Secrets Operator (ESO) reaches AWS Secrets Manager for this
# namespace. Requires ESO and its CRDs to be installed in the cluster
# (external-secrets.io/v1 needs ESO 0.17+; older installs use v1beta1).
#
# A namespaced SecretStore (rather than a ClusterSecretStore) keeps the blast
# radius small: only workloads in data-sync can read through it, and the IAM
# role below can only read data-sync's own secret.

# ESO authenticates as this ServiceAccount via IRSA. It is separate from the
# app's ServiceAccount on purpose: the app itself never gets AWS credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-sync-secrets-reader
  annotations:
    # IAM role trusted by the cluster's OIDC provider for this ServiceAccount.
    # Its policy only needs:
    #   secretsmanager:GetSecretValue, secretsmanager:DescribeSecret
    #     on arn:aws:secretsmanager:us-east-1:123456789012:secret:brightedge/production/data-sync/redis-*
    #   kms:Decrypt on the key, if the secret uses a customer-managed KMS key
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/data-sync-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: data-sync-secrets-reader
