apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-sync

# The base is the Helm chart rendered with production values.
# Regenerate it with `make render` whenever the chart or values change.
resources:
  - ../base
  # Creates the data-sync-redis Secret from AWS Secrets Manager. On the very
  # first apply, pods may show CreateContainerConfigError for a few seconds
  # until ESO has synced the Secret; the kubelet retries on its own.
  - secret-store.yaml
  - external-secret.yaml

# Release bumps happen here, so a new version is a one-line change in git.
images:
  - name: 123456789012.dkr.ecr.us-east-1.amazonaws.com/brightedge/data-sync
    newTag: "1.0.0"

patches:
  # Spread pods across availability zones.
  - path: patch-topology-spread.yaml
    target:
      kind: Deployment
      name: data-sync

  # Roll the pods when the Redis Secret changes. In production the Secret is
  # managed outside Helm, so the chart can't hash it for us. After a rotation,
  # `make secret-checksum` sets the annotation to the new AWS version ID.
  - path: patch-secret-checksum.yaml
    target:
      kind: Deployment
      name: data-sync
