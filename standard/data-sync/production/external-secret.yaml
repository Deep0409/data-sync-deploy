# Creates and keeps updated the Kubernetes Secret `data-sync-redis`, which the
# chart references in production (secret.existingSecret in values.production.yaml).
#
# Source of truth is AWS Secrets Manager, secret
# brightedge/production/data-sync/redis, stored as JSON: {"password": "..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-sync-redis
spec:
  # How often ESO re-reads AWS. After a rotation you don't have to wait for
  # this; force an immediate sync with:
  #   kubectl -n data-sync annotate externalsecret data-sync-redis force-sync=$(date +%s) --overwrite
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: data-sync-redis
    # Orphan instead of the default Owner. With Owner, the Secret gets an
    # ownerReference to this ExternalSecret, so Kubernetes deletes the Secret
    # whenever the ExternalSecret goes away: a pruning deploy after a rename,
    # or ESO being uninstalled together with its CRDs. Running pods would carry
    # on, but every new pod (HPA scale-out, node drain, rollout) would fail with
    # CreateContainerConfigError. Orphan still creates and updates the Secret;
    # it just doesn't tie its life to this resource.
    # Cost: when the service is retired, delete the Secret by hand.
    creationPolicy: Orphan
    # This covers the other direction: if the AWS secret is deleted or can't be
    # read, keep the last good copy in the cluster rather than removing it.
    deletionPolicy: Retain
  data:
    # The key name must match secret.key in the chart (REDIS_PASSWORD).
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: brightedge/production/data-sync/redis
        property: password
