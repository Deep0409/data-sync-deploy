# Adds the SECRET_CHECKSUM annotation to the pod template. Kubernetes only
# restarts pods when the template changes, so a new value means a rolling
# restart that picks up the rotated secret.
#
# The value is the AWS Secrets Manager version ID (AWSCURRENT) of the Redis
# secret, not a hash of the password. It changes on every rotation but says
# nothing about the password, so it is safe in git and in pod metadata that
# far more people can read than the Secret itself.
#
# Written by scripts/secret-checksum.sh (make secret-checksum) once External
# Secrets has synced the new version. Don't edit it by hand. The zeros are a
# placeholder until the script has run against the real secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-sync
spec:
  template:
    metadata:
      annotations:
        SECRET_CHECKSUM: "00000000-0000-0000-0000-000000000000"
