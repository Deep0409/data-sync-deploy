{{- /*
  Only rendered when the chart owns the Secret (dev and staging). In
  production secret.create is false and the Secret comes from External
  Secrets, so the password never lands in git or in Helm's release history.
*/}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-sync.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
type: Opaque
# stringData lets Kubernetes do the base64 encoding for us.
stringData:
  {{ .Values.secret.key }}: {{ .Values.secret.redisPassword | quote }}
{{- end }}
