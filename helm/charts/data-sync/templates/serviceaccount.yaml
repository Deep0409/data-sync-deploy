{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "data-sync.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Same reason as in the Deployment: no API token unless the app needs one.
automountServiceAccountToken: false
{{- end }}
