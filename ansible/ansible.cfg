[defaults]
# Static example inventory. Switch to inventory.aws_ec2.yml on AWS (needs the
# amazon.aws collection and boto3).
inventory = ./inventory.yml
roles_path = ./roles
result_format = yaml
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent

[ssh_connection]
# Fewer SSH round trips per task. Also lets `become_user` work for an
# unprivileged service user without extra ACL packages on the host.
pipelining = True
